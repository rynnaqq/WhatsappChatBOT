<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in · Relay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/login.js" type="module"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="brand login-brand" href="/login"><span class="brand-mark" aria-hidden="true">r</span><span>relay<span class="brand-subtitle">WhatsApp AI</span></span></a>
    <section class="login-card" aria-labelledby="login-title">
      <span class="eyebrow">YOUR ASSISTANT, YOUR SPACE</span>
      <h1 id="login-title">Welcome to Relay</h1>
      <p class="intro">Sign in to connect WhatsApp and manage your AI assistant.</p>
      <form id="login-form" action="/api/auth/login" method="post">
        <label for="password">Dashboard password</label>
        <div class="password-control">
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" aria-describedby="login-error" autofocus>
          <button class="reveal-button" id="reveal-password" type="button" aria-pressed="false">Show</button>
        </div>
        <p id="login-error" class="field-error" role="alert"></p>
        <button id="login-submit" class="button primary full-width" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="login-help">Use the password you chose during setup.</p>
      <noscript><p class="field-error">Enable JavaScript to use the dashboard.</p></noscript>
    </section>
    <footer class="login-footer"><span class="tiny-dot" aria-hidden="true"></span> Self-hosted. Under your control.</footer>
  </main>
</body>
</html>
